function renderArmCard(armName, arm, isAdopted) {
  const model = arm.model || 'default';
  const evalInfo = arm.evaluation || {};
  const scores = evalInfo.scores || {};
  const comp = typeof evalInfo.compositeScore === 'number' ? evalInfo.compositeScore : null;
  const passed = Boolean(evalInfo.passed);
  const isBest = arm.isBestArm || false;
  const isAdoptedArm = isAdopted && armName === (ARENA_STATUS?.adoptedArm);

  const dimNames = {
    taskCompletion: '目标达成',
    gatePassRate: '门禁通过',
    sandboxCompliance: '符号遵从',
    testImpactPrecision: '影响收敛',
    stepEfficiency: '步骤效率',
  };

  const rubricRowsHtml = Object.entries(dimNames).map(([dimKey, dimLabel]) => {
    const s = typeof scores[dimKey] === 'number' ? scores[dimKey] : null;
    const pct = s != null ? Math.round(s * 100) : 0;
    const fillClass = s != null ? (s >= 0.8 ? 'pass' : s >= 0.5 ? '' : 'fail') : '';
    return `
      <div class="rubric-row">
        <span>${dimLabel}</span>
        <div style="display:flex;align-items:center;">
          <div class="rubric-track"><div class="rubric-fill ${fillClass}" style="width:${pct}%"></div></div>
          <span style="min-width:32px;text-align:right;">${s != null ? pct + '%' : '-'}</span>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="arm-card ${isBest ? 'best-arm' : ''}">
      <div class="arm-header">
        <div class="arm-name">
          ${isBest ? '🌟 ' : ''}${esc(armName)}
          ${isAdoptedArm ? '<span class="chip-status done">已采纳</span>' : ''}
        </div>
        <span class="model-badge">🤖 ${esc(model)}</span>
      </div>
      <div style="font:11px/1.4 var(--mono);color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;">
        <span>分支: <code style="color:var(--text);">${esc(arm.branch || '')}</code></span>
        <span>代码状态: <b>${esc(arm.status || 'unknown')}</b></span>
      </div>
      <div style="font:11px/1.4 var(--mono);color:var(--muted);">
        Diff 规模: <b style="color:var(--text);">${esc(arm.diffSummary || '无改动')}</b>
        ${arm.dirtyFiles?.length ? `<span style="color:var(--warn);margin-left:6px;">(${arm.dirtyFiles.length} 脏文件)</span>` : ''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:2px;">
        <span style="font:600 11px/1 var(--mono);color:var(--text);">综合效能评分</span>
        ${comp != null
          ? `<span class="radar-composite-badge ${passed ? 'pass' : 'fail'}">${passed ? '✅ PASS' : '❌ FAIL'} ${(comp * 100).toFixed(1)}%</span>`
          : '<span style="font:11px/1 var(--mono);color:var(--muted);">未跑测</span>'}
      </div>
      <div class="rubric-bars">
        ${rubricRowsHtml}
      </div>
      <div style="margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span style="font:10px/1.2 var(--mono);color:var(--muted);">耗时: ${evalInfo.durationMs ? (evalInfo.durationMs / 1000).toFixed(2) + 's' : '-'}</span>
        <button class="arena-btn primary" style="padding:4px 10px;" onclick="executeArenaAdopt('${esc(ARENA_CURRENT_TOPIC)}', '${esc(armName)}')">
          ${isAdoptedArm ? '已采纳此方案' : '采纳此方案 (Adopt)'}
        </button>
      </div>
    </div>
  `;
}

function renderBenchmarkSection() {
  if (!EVAL_BENCHMARKS || EVAL_BENCHMARKS.length === 0) {
    return `
      <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px;">
        <h3 style="font:600 13px/1 var(--mono);color:var(--text);margin-bottom:10px;">历史评测基准天梯 (Benchmark Leaderboard)</h3>
        <div style="font:12px/1.4 var(--mono);color:var(--muted);">暂无落盘评测凭证 (.agents/evals/results.jsonl)</div>
      </div>
    `;
  }

  const rows = EVAL_BENCHMARKS.slice(-10).reverse().map((b) => {
    const ts = b.timestamp ? b.timestamp.replace('T', ' ').slice(0, 19) : '-';
    const rate = typeof b.passRate === 'number' ? (b.passRate * 100).toFixed(1) + '%' : '-';
    const tasks = b.tasks != null ? b.tasks : '-';
    const passTag = (b.passRate || 0) >= 0.8 ? '<span style="color:var(--ok);">✅ PASS</span>' : '<span style="color:var(--bad);">❌ FAIL</span>';
    return `
      <tr>
        <td>${esc(ts)}</td>
        <td><span class="model-badge">🤖 ${esc(b.model || 'default')}</span></td>
        <td><b>${rate}</b></td>
        <td>${tasks}</td>
        <td>${passTag}</td>
        <td style="color:var(--muted);">${esc(b.note || '')}</td>
      </tr>
    `;
  }).join('');

  return `
    <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h3 style="font:600 13px/1 var(--mono);color:var(--text);margin:0;">历史评测基准天梯 (Benchmark Leaderboard · 最近 10 条)</h3>
        <span style="font:11px/1 var(--mono);color:var(--muted);">来源: .agents/evals/results.jsonl</span>
      </div>
      <div style="overflow-x:auto;">
        <table class="benchmark-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>模型</th>
              <th>通过率</th>
              <th>任务数</th>
              <th>状态</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function selectArenaTopic(t) {
  ARENA_CURRENT_TOPIC = t;
  refreshArena();
}

async function executeArenaEval(topic) {
  if (!topic) return;
  toast('开始跑测评估各候选臂…');
  try {
    const res = await fetch('/api/arena/eval', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'eval failed');
    toast(`打擂跑测完成！推荐胜出方案: ${data.bestArm || '无'}`);
    refreshArena();
  } catch (e) {
    toast(`打擂跑测失败: ${e.message}`);
  }
}

async function executeArenaAdopt(topic, arm) {
  if (!topic || !arm) return;
  if (!confirm(`确定采纳方案 "${arm}" 并将改动应用至主代码仓库？`)) return;
  toast(`正在采纳候选臂 "${arm}"…`);
  try {
    const res = await fetch('/api/arena/adopt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, arm, clean: false }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'adopt failed');
    toast(`已成功采纳方案 "${arm}" 到主工作区！`);
    refreshArena();
  } catch (e) {
    toast(`采纳方案失败: ${e.message}`);
  }
}

async function executeArenaCleanup(topic) {
  if (!topic) return;
  if (!confirm(`确定清理收擂主题 "${topic}" 的所有临时分支与隔离沙盒？`)) return;
  toast(`正在清理打擂环境…`);
  try {
    const res = await fetch('/api/arena/cleanup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, force: true }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'cleanup failed');
    toast(`打擂主题 "${topic}" 已成功清理！`);
    ARENA_CURRENT_TOPIC = '';
    refreshArena();
  } catch (e) {
    toast(`清理收擂失败: ${e.message}`);
  }
}

async function openArenaReport(topic) {
  if (!topic) return;
  toast('正在生成决策对质矩阵报告…');
  try {
    const res = await fetch(`/api/arena/report?topic=${encodeURIComponent(topic)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'report failed');

    let modal = $('#arena-report-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'arena-report-modal';
      modal.className = 'arena-report-modal';
      document.body.appendChild(modal);
    }
    const htmlReport = typeof marked !== 'undefined' ? marked.parse(data.report || '') : `<pre>${esc(data.report || '')}</pre>`;
    modal.innerHTML = `
      <div class="arena-report-content">
        <div class="arena-report-header">
          <h3 style="font:600 14px/1 var(--mono);color:var(--text);margin:0;">📊 方案打擂决策对质矩阵 · ${esc(topic)}</h3>
          <button class="w-btn" onclick="document.getElementById('arena-report-modal').style.display='none'">关闭 (Esc)</button>
        </div>
        <div class="arena-report-body md">
          ${htmlReport}
        </div>
      </div>
    `;
    modal.style.display = 'flex';
  } catch (e) {
    toast(`生成报告失败: ${e.message}`);
  }
}

function switchView(v) {
  VIEW = v;
  const isRuns = v === 'runs';
  const isEngine = v === 'engine';
  const isTasks = v === 'tasks';
  const isArena = v === 'arena';
  $('#board').style.display = isRuns || isEngine || isTasks || isArena ? 'none' : '';
  $('#runs-view').style.display = isRuns ? '' : 'none';
  $('#engine-view').style.display = isEngine ? '' : 'none';
  $('#tasks-view').style.display = isTasks ? '' : 'none';
  $('#arena-view').style.display = isArena ? '' : 'none';
  $('#view-runs').classList.toggle('on', isRuns);
  $('#view-engine').classList.toggle('on', isEngine);
  $('#view-tasks').classList.toggle('on', isTasks);
  $('#view-arena').classList.toggle('on', isArena);
  $('#q').placeholder = isRuns ? '过滤 runId / 需求 / 阶段…' : isEngine ? '过滤 规则名…' : isTasks ? '过滤 任务名 / 标题…' : isArena ? '过滤 方案 / 模型…' : '过滤 标题 / slug / 文件…';
  if (isTasks) refreshBoard(); // 任务与卡片同一 /api/board 载荷；refreshBoard 内按 VIEW 渲染任务区
  else if (isRuns) refreshRuns(); else if (isEngine) refreshEngine(); else if (isArena) refreshArena(); else refreshBoard();
}

function openCard(card) { CURRENT = card; TAB = 'doc'; $('#drawer').classList.add('open'); renderDrawer(); }

// —— toast 反馈 ——
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// —— 抽屉内文档内链：md 相对链接 → 抽屉内打开；外链新窗口；仓库代码路径 → vscode 协议 ——
function viewFile(rel) {
  const hit = CARDS.find((c) => c.file === rel);
  if (hit) { openCard(hit); return; }
  // 自由文档（不在看板卡范围，如 workflow/README.md、同名以外的引用）：伪卡视图
  CURRENT = { file: rel, name: rel, slug: rel, title: rel, type: 'link', status: '', level: '', date: '' };
  TAB = 'doc';
  $('#drawer').classList.add('open');
  renderDrawer();
}

function onDocLink(e, a) {
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#')) return; // 页内锚点走默认行为
  if (/^https?:/i.test(href)) { e.preventDefault(); window.open(href, '_blank', 'noopener'); return; }
  e.preventDefault();
  const dir = CURRENT.file.includes('/') ? CURRENT.file.replace(/[^/]*$/, '') : '';
  let rel;
  try { rel = decodeURIComponent(new URL(href, 'http://x/' + dir).pathname.slice(1)); } catch { return; }
  if (/\.md$/i.test(rel)) { viewFile(rel); return; }
  if (ROOT && !/^[a-z]+:/i.test(rel)) { window.open(`vscode://file/${ROOT}/${rel}`); toast('已用编辑器打开 ' + rel); }
}

document.addEventListener('click', (e) => {
  const artTag = e.target.closest('.art-tag');
  if (artTag) {
    e.stopPropagation();
    viewFile(artTag.dataset.file);
    return;
  }
  const dLink = e.target.closest('#d-body a');
  if (dLink) { onDocLink(e, dLink); return; }
  // 展开区文档条目 → 开抽屉（先于卡片命中，条目在卡内）
  const item = e.target.closest('.doc-item');
  if (item) {
    const hit = CARDS.find((c) => c.file === item.dataset.file);
    if (hit) openCard(hit);
    return;
  }
  // 卡片点击 → 就地展开/收起该任务
  const card = e.target.closest('.card');
  if (card) {
    const slug = card.dataset.slug;
    if (EXPANDED.has(slug)) EXPANDED.delete(slug); else EXPANDED.add(slug);
    card.classList.toggle('open');
    return;
  }
  const rel = e.target.closest('#d-related a');
  if (rel) {
    const hit = CARDS.find((c) => c.file === rel.dataset.file);
    if (hit) { CURRENT = hit; renderDrawer(); }
    return;
  }
  const hash = e.target.closest('.hash');
  if (hash) navigator.clipboard.writeText(hash.dataset.h)
    .then(() => toast('已复制 ' + hash.dataset.h.slice(0, 9)))
    .catch(() => toast('复制失败'));
  // 执行器 run 卡片 → 开抽屉（时间线）
  const runCard = e.target.closest('.run-card');
  if (runCard) {
    const hit = RUNS.find((r) => r.runId === runCard.dataset.run);
    if (hit) openRun(hit.runId);
    return;
  }
});
$('#d-close').onclick = () => { $('#drawer').classList.remove('open'); RUN_CURRENT = null; };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#drawer').classList.remove('open'); RUN_CURRENT = null; const m = $('#arena-report-modal'); if (m) m.style.display = 'none'; } });
// 抽屉 tab：run 抽屉（概览/时间线/工单/产物）与文档抽屉（文档/历史）分开处理
document.querySelectorAll('#d-tabs button').forEach((b) => b.onclick = () => {
  if (b.classList.contains('run-tab') && RUN_CURRENT) { RUN_TAB = b.dataset.tab; renderRunDrawer(); }
  else if (!b.classList.contains('run-tab')) { TAB = b.dataset.tab; renderDrawer(); }
});
$('#view-runs').onclick = () => switchView(VIEW === 'runs' ? 'board' : 'runs');
$('#view-engine').onclick = () => switchView(VIEW === 'engine' ? 'board' : 'engine');
$('#view-tasks').onclick = () => switchView(VIEW === 'tasks' ? 'board' : 'tasks');
$('#view-arena').onclick = () => switchView(VIEW === 'arena' ? 'board' : 'arena');

// ---- 看门狗巡检与熔断控制（2026-11-26 方案3 watchdog）----
let WATCHDOG_STATUS = null;
let WATCHDOG_BANNER_DISMISSED = false;

async function refreshWatchdog() {
  try {
    const resp = await fetch('/api/watchdog/status');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    WATCHDOG_STATUS = await resp.json();
    renderWatchdogIndicator();
    renderWatchdogBanner();
  } catch (e) {
    // 静默容错
  }
}

function renderWatchdogIndicator() {
  const ind = $('#watchdog-indicator');
  if (!ind || !WATCHDOG_STATUS) return;
  const { health, alerts } = WATCHDOG_STATUS;
  ind.className = `watchdog-indicator ${health || 'ok'}`;
  const span = ind.querySelector('span');
  if (health === 'critical') {
    span.textContent = `看门狗: ${alerts?.length || 1} 告警`;
  } else if (health === 'warning') {
    span.textContent = `看门狗: ${alerts?.length || 1} 预警`;
  } else {
    span.textContent = `看门狗: 正常`;
  }
}

function renderWatchdogBanner() {
  const banner = $('#watchdog-banner');
  if (!banner) return;
  if (!WATCHDOG_STATUS || (!WATCHDOG_STATUS.alerts?.length) || WATCHDOG_BANNER_DISMISSED) {
    banner.classList.remove('show');
    banner.innerHTML = '';
    return;
  }
  const alerts = WATCHDOG_STATUS.alerts;
  const topAlert = alerts.find((a) => a.severity === 'critical') || alerts[0];
  banner.className = `watchdog-banner ${topAlert.severity === 'critical' ? '' : 'warning'} show`;
  const isAll = topAlert.runId === '*';
  banner.innerHTML =
    `<div class="watchdog-banner-content">` +
    `  <span>⚡ <b>看门狗巡检告警：</b>${esc(topAlert.message)}</span>` +
    `  ${!isAll ? `<code style="background:rgba(0,0,0,0.1);padding:1px 5px;border-radius:2px">${esc(topAlert.runId)}</code>` : ''}` +
    `</div>` +
    `<div class="watchdog-banner-actions">` +
    (!isAll
      ? `  <button class="w-btn danger" onclick="triggerCircuitBreak('${esc(topAlert.runId)}', '看门狗横幅一键紧急熔断')">⚡ 紧急熔断</button>` +
        `  <button class="w-btn" onclick="openRunDrawerById('${esc(topAlert.runId)}')">定位任务 ↗</button>`
      : '') +
    `  <button class="w-btn" onclick="dismissWatchdogBanner()">忽略</button>` +
    `</div>`;
}

function dismissWatchdogBanner() {
  WATCHDOG_BANNER_DISMISSED = true;
  renderWatchdogBanner();
}

function openRunDrawerById(runId) {
  if (VIEW !== 'runs') switchView('runs');
  openRun(runId);
}

async function triggerCircuitBreak(runId, reason) {
  if (!confirm(`确定要对流水线 [${runId}] 执行紧急熔断吗？\n将终止当前停滞阶段并将任务标记为 aborted。`)) return;
  try {
    const resp = await fetch('/api/watchdog/circuit-break', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ runId, reason: reason || '用户在 Web 看板一键紧急熔断' }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    toast(`已紧急熔断流水线 ${runId}`);
    WATCHDOG_BANNER_DISMISSED = false;
    await refreshWatchdog();
    await refreshRuns();
    if (RUN_CURRENT && RUN_CURRENT.runId === runId) {
      openRun(runId);
    }
  } catch (e) {
    toast(`熔断失败: ${e.message}`);
  }
}

const wdInd = $('#watchdog-indicator');
if (wdInd) {
  wdInd.onclick = () => {
    WATCHDOG_BANNER_DISMISSED = false;
    renderWatchdogBanner();
    if (VIEW !== 'runs') switchView('runs');
  };
}

// SSE：服务端 fs.watch 防抖后推送 changed → 看板与打开中的抽屉自动刷新
const sse = new EventSource('/api/events');
sse.addEventListener('changed', () => {
  refreshBoard().then((ok) => { if (ok && !RUN_CURRENT) renderDrawer(); });
  if (VIEW === 'runs') refreshRuns();
  if (VIEW === 'engine') refreshEngine();
  if (VIEW === 'arena') refreshArena();
  refreshWatchdog();
  if (RUN_CURRENT) {
    fetch(`/api/run?file=${encodeURIComponent(RUN_CURRENT.runId + '.json')}`)
      .then((r) => r.ok ? r.json() : null)
      .then((data) => {
        if (data?.run) {
          RUN_CURRENT = data.run;
          renderRunDrawer();
        }
      })
      .catch(() => {});
  }
});
sse.addEventListener('arena-eval', () => {
  if (VIEW === 'arena') refreshArena();
});
sse.addEventListener('watchdog-alert', () => {
  refreshWatchdog();
  if (VIEW === 'runs') refreshRuns();
});
sse.addEventListener('watchdead', () => { $('#sse').classList.remove('on'); $('#sse').classList.add('poll'); $('#sse span:last-child').textContent = '监听失效 · 60s 轮询'; });
sse.onopen = () => { $('#sse').classList.add('on'); $('#sse').classList.remove('poll'); $('#sse span:last-child').textContent = '实时'; };
sse.onerror = () => { $('#sse').classList.remove('on'); $('#sse span:last-child').textContent = '连接断开，自动重连中'; };

// 60s 兜底轮询：SSE/watch 任何环节失效时数据仍保鲜（正常时多拉一次无害）
setInterval(() => { refreshBoard(); if (VIEW === 'runs') refreshRuns(); if (VIEW === 'engine') refreshEngine(); if (VIEW === 'arena') refreshArena(); refreshWatchdog(); }, 60000);

// 搜索过滤：本地过滤标题/slug/文件，SSE 刷新时保持关键字
// 击键去抖 400ms（复核 P2-2 rider）：/api/board 服务端有 loop TTL 缓存，去抖进一步避免连发请求排队
let qTimer = null;
$('#q').addEventListener('input', (e) => {
  Q = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { if (VIEW === 'runs') refreshRuns(); else if (VIEW === 'engine') renderEngine(); else if (VIEW === 'arena') renderArena(); else refreshBoard(); }, 400);
});

// 首次入场：列错峰上浮一次（.boot 稍后摘除，SSE / 过滤触发的重渲染不再重播）
$('#board').classList.add('boot');
refreshBoard();
refreshWatchdog();
setTimeout(() => $('#board').classList.remove('boot'), 1500);
</script>
</body>
