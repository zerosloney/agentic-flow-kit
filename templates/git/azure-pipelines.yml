# Azure Pipelines — AI-native 门禁
# 生成的默认档：main 全量、develop/PR 中档。tier=lean 时安装器不写本文件。
trigger:
  branches:
    include:
      - main
      - develop
pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node 22'

  - script: |
      if [ -f package.json ]; then
        npm install
      fi
    displayName: 'Install (if package.json)'

  - script: node .agents/scripts/verify.mjs --full
    displayName: 'Static gates (verify --full)'

  - script: node .agents/scripts/check-local-gates.mjs
    displayName: 'Local gate wiring audit'
    continueOnError: true

  - script: node .agents/scripts/agent-eval.mjs check --advisory
    displayName: 'Behavior eval (advisory; remove --advisory after baseline)'
    continueOnError: true

  - script: node .agents/scripts/check-pipeline-state.mjs
    displayName: 'Pipeline state closure'
    continueOnError: true

  - script: node .agents/scripts/memory-tier.mjs audit
    displayName: 'Injected memory budget'
    continueOnError: true
