# Azure Pipelines — AI-native 门禁
# 生成的默认档：main 全量、develop/PR 中档。tier=lean 时安装器不写本文件。
trigger:
  branches:
    include:
      - main
      - develop
pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node 22'

  - script: |
      if [ -f package.json ]; then
        npm install
      fi
    displayName: 'Install (if package.json)'

  - script: npx --yes agentic-flow-kit run verify --full
    displayName: 'Static gates (verify --full)'

  - script: npx --yes agentic-flow-kit run check-local-gates
    displayName: 'Local gate wiring audit'
    continueOnError: true

  - script: npx --yes agentic-flow-kit run agent-eval check --advisory
    displayName: 'Behavior eval (advisory; remove --advisory after baseline)'
    continueOnError: true

  - script: npx --yes agentic-flow-kit run check-pipeline-state
    displayName: 'Pipeline state closure'
    continueOnError: true

  - script: npx --yes agentic-flow-kit run sbom-license.mjs --check
    displayName: 'SBOM & license policy (advisory)'
    continueOnError: true

  - script: npx --yes agentic-flow-kit run check-devcontainer.mjs
    displayName: 'Devcontainer declaration (advisory)'
    continueOnError: true

  - script: npx --yes agentic-flow-kit run memory-tier audit
    displayName: 'Injected memory budget'
    continueOnError: true
