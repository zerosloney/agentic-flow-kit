name: ai-native-gates

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install (if package.json)
        run: |
          if [ -f package.json ]; then npm install; fi
      - name: Static gates
        run: npx --yes agentic-flow-kit run verify --full
      - name: Local gate wiring audit
        run: npx --yes agentic-flow-kit run check-local-gates
        continue-on-error: true
      - name: Behavior eval (advisory)
        run: npx --yes agentic-flow-kit run agent-eval check --advisory
        continue-on-error: true
      - name: Secrets scan (gitleaks / lite fallback)
        run: npx --yes agentic-flow-kit run check-secrets.mjs
        continue-on-error: true
      - name: SBOM & license policy (advisory)
        run: npx --yes agentic-flow-kit run sbom-license.mjs --check
        continue-on-error: true
      - name: Pipeline state closure
        run: npx --yes agentic-flow-kit run check-pipeline-state
        continue-on-error: true
      - name: Injected memory budget
        run: npx --yes agentic-flow-kit run memory-tier audit
        continue-on-error: true
      - name: Memory lifecycle audit
        run: npx --yes agentic-flow-kit run memory-lifecycle.mjs report --check
        continue-on-error: true
