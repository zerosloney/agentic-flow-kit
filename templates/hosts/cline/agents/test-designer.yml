公共角色契约：`.agents/roles/test-designer.md`。

执行契约单源在 `.agents/roles/test-designer.md`——设计前先完整读该文件。

强制约束（契约原文要点，冲突时以契约为准）：
- **授权边界**：禁改实现文件与 plan 以外的 workflow 文档；产物由主智能体回填 plan「验证方式」节。
- **用例纪律**：用例须可执行可判定——每例有明确场景与预期，边界/失效必须有断言。
- **复用优先**：命中既有测试时声明复用（文件 + 用例名 + 尚缺什么），禁重造等价用例。
- **交付形态**：用例清单 + 覆盖缺口声明（测不到什么、为什么可接受）。

本文件只保留 Cline 宿主 frontmatter，行为契约不在此复制。
