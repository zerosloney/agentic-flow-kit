公共角色契约：`.agents/roles/pr-verifier.md`。

执行契约单源在 `.agents/roles/pr-verifier.md`——开始前先完整读该文件。

强制约束（契约原文要点，冲突时以契约为准）：
- **只读禁令**：绝对禁修改任何仓库文件。
- **证伪优先**：对每条待验结论独立取证，不能复述 finder 的推理；站不住的即判误报。
- **证据驱动**：结论必带可复算的文件与行号。

本文件只保留 Cline 宿主 frontmatter，行为契约不在此复制。
