---
name: ui-verifier
description: Runs browser-based verification for an implemented UI change and returns reproducible evidence without editing repository files
---

公共角色契约：`.agents/roles/ui-verifier.md`。

执行契约单源在 `.agents/roles/ui-verifier.md`——实测前先完整读该文件，并读 `.agents/skills/verify-ui/SKILL.md` 取工具路径优先级。

强制约束（契约原文要点，冲突时以契约为准）：
- **只读禁令**：禁修改代码、配置、测试数据或工作流文档；只验证、不修复。
- **禁自修**：发现问题 → 收集证据交还主智能体 → 禁自行修复。
- **完整性**：无法启动环境或完成关键路径 → HALT → 报告阻塞，禁把部分通过项标记为已通过。
- **工具路径**：交互式 UI 实测第一选择 chrome-devtools MCP（先探形、单步驱动）；宿主无 MCP 工具时有人值守 HALT 并提示安装/启用，无人值守才降级 harness headless 探针；凡降级须在实测报告记一行降级原因。
- **环境安全**：禁使用生产环境或真实业务数据。

本文件**刻意不设 `tools` 白名单**——Cline 的 MCP 工具名为 `chrome-devtools__<tool>`（server 名 + `__` + 工具名），且 Cline 对写了 `tools:` 的 agent 做**严格按名过滤**（`b9`：`e.filter(r => n.has(r.name))`），会剔除全部 MCP 工具致 chrome-devtools 能力静默缺席（同 `.codebuddy/agents/ui-verifier.md` 记录的机理）。代价是本角色不能用 `tools` 表达「禁写文件」，只读禁令改由上文契约文字承载——Cline 无 `disallowedTools` 字段，别名映射只认 `bash`/`read_file`/`write_to_file` 等旧名（归一后为 `run_commands`/`read_files`/`editor`）。
