<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Workflow 看板 — AI 执行流程</title>
<script src="/marked.min.js"></script>
<style>
  :root {
    --bg: #14171c; --panel: #1c2027; --card: #232833; --card-hover: #2b3140;
    --border: #2e3542; --text: #d7dce4; --dim: #8b93a1;
    --intent: #4f8ef7; --incident: #e0674f; --spec: #9a6ff0; --plan: #2fa87c;
    --ok: #3fbf7f; --warn: #d9a53a; --bad: #e0674f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; font-weight: 600; }
  .chip { font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1px 9px; }
  #sse { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); margin-left: auto; }
  #sse i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  #sse.on i { background: var(--ok); }
  #board { display: flex; gap: 10px; padding: 14px 18px; overflow-x: auto; height: calc(100vh - 53px); }
  .col { flex: 1 1 0; min-width: 215px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .col h2 { font-size: 13px; font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--dim); }
  .col h2 b { color: var(--text); margin-right: 4px; }
  .col .list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 7px; }
  .card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  .card:hover { background: var(--card-hover); border-color: var(--dim); }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .type { font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #fff; border-radius: 3px; padding: 0 5px; }
  .lv { font-size: 10px; font-weight: 700; border: 1px solid var(--dim); color: var(--dim); border-radius: 3px; padding: 0 4px; }
  .lv.hi { border-color: var(--warn); color: var(--warn); }
  .date { font-size: 11px; color: var(--dim); margin-left: auto; }
  .acpt { font-size: 10px; border: 1px solid var(--border); color: var(--dim); border-radius: 3px; padding: 0 4px; }
  .acpt.full { color: var(--ok); border-color: var(--ok); }
  .age { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 0 4px; }
  .age.a1 { color: var(--warn); border: 1px solid var(--warn); }
  .age.a2 { color: #fff; background: var(--bad); }
  .card.age1 { outline: 1px solid var(--warn); outline-offset: -1px; }
  .card.age2 { outline: 1px solid var(--bad); outline-offset: -1px; }
  .alrt { color: var(--bad); font-size: 11px; cursor: help; }
  #q { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 3px 10px; font-size: 12px; width: 180px; }
  #q:focus { outline: none; border-color: var(--intent); }
  .hold { font-size: 10px; font-weight: 700; color: var(--bad); border: 1px solid var(--bad); border-radius: 3px; padding: 0 4px; margin-right: 5px; }
  .ct { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  #toast { position: fixed; top: 54px; right: 18px; background: var(--card); border: 1px solid var(--ok); color: var(--text); border-radius: 6px; padding: 6px 14px; font-size: 12.5px; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .card .title { font-size: 12.5px; line-height: 1.45; }
  /* 任务卡：作者 + 展开的文档清单 */
  .auth { font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 0 7px; }
  .type.mini { font-size: 9px; padding: 0 4px; }
  .docs { display: none; border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 4px; flex-direction: column; gap: 2px; }
  .card.open .docs { display: flex; }
  .doc-item { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .doc-item:hover { background: var(--card-hover); }
  .doc-item .doc-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-item .chip { font-size: 10px; padding: 0 5px; flex-shrink: 0; }
  .empty { color: var(--dim); font-size: 12px; text-align: center; padding: 18px 0; }
  /* 抽屉 */
  #drawer { position: fixed; top: 0; right: -780px; width: min(760px, 92vw); height: 100vh; background: var(--panel); border-left: 1px solid var(--border); transition: right .18s ease; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.4); z-index: 10; }
  #drawer.open { right: 0; }
  #d-head { padding: 14px 18px 8px; }
  #d-title { font-size: 16px; font-weight: 600; margin: 6px 0 8px; }
  #d-close { float: right; background: none; border: none; color: var(--dim); font-size: 20px; cursor: pointer; }
  #d-close:hover { color: var(--text); }
  #d-related { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  #d-related a { font-size: 11px; color: var(--intent); background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1px 9px; cursor: pointer; text-decoration: none; }
  #d-related a:hover { border-color: var(--intent); }
  #d-tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--border); }
  #d-tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim); font-size: 13px; padding: 7px 12px; cursor: pointer; }
  #d-tabs button.on { color: var(--text); border-bottom-color: var(--intent); }
  #d-body { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  #sse.poll i { background: var(--warn); }
  /* md 渲染 */
  .md h1, .md h2, .md h3 { margin: 18px 0 8px; line-height: 1.35; } .md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14.5px; }
  .md p, .md ul, .md ol { margin: 6px 0; } .md li { margin: 2px 0; }
  .md code { background: var(--card); border-radius: 3px; padding: 1px 5px; font-size: 12.5px; }
  .md pre { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; } .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; } .md th, .md td { border: 1px solid var(--border); padding: 4px 10px; } .md th { background: var(--card); }
  .md blockquote { border-left: 3px solid var(--border); color: var(--dim); padding-left: 12px; margin: 8px 0; }
  .md a { color: var(--intent); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  /* 历史时间线 */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
  .tl-item { position: relative; padding: 4px 0 10px; }
  .tl-item::before { content: ""; position: absolute; left: -20px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--intent); }
  .tl-sub { color: var(--text); font-size: 13px; }
  .tl-meta { color: var(--dim); font-size: 12px; }
  .tl-meta code { cursor: pointer; } .tl-meta code:hover { color: var(--text); }
  .none { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Workflow 看板</h1>
  <span class="chip" id="c-intents"></span><span class="chip" id="c-incidents"></span>
  <span class="chip" id="c-plans"></span><span class="chip" id="c-specs"></span>
  <span class="chip" id="c-alerts" style="display:none"></span>
  <input id="q" placeholder="过滤 标题 / slug / 文件…" spellcheck="false">
  <span id="sse"><i></i><span>连接断开</span></span>
</header>
<div id="board"></div>

<div id="drawer">
  <div id="d-head">
    <button id="d-close" title="关闭 (Esc)">×</button>
    <div id="d-badges"></div>
    <div id="d-title"></div>
    <div id="d-related"></div>
  </div>
  <div id="d-tabs">
    <button data-tab="doc" class="on">文档</button>
    <button data-tab="hist">修改历史</button>
  </div>
  <div id="d-body"></div>
</div>
<div id="toast"></div>

<script>
const COLS = [
  { key: 'draft',     name: '起草',   statuses: ['draft'] },
  { key: 'active',    name: '进行中', statuses: ['approved', 'open'] },
  { key: 'done',      name: '完成',   statuses: ['done', 'fixed'] },
  { key: 'closed',    name: '关闭',   statuses: ['closed'] },
  { key: 'gone',      name: '废弃',   statuses: ['superseded', 'cancelled'] },
];
const TYPE_LABEL = { intents: 'INTENT', incidents: 'INCIDENT', plans: 'PLAN', specs: 'SPEC' };
const TYPE_COLOR = { intents: 'var(--intent)', incidents: 'var(--incident)', plans: 'var(--plan)', specs: 'var(--spec)' };

let CARDS = [];            // 最近一次 /api/board 的卡片
let CURRENT = null;        // 抽屉当前打开的卡片
let TAB = 'doc';
let retryTimer = null;     // /api/board 失败后的重试定时器
let ROOT = '';             // 仓库根（/api/board 返回，内链 vscode 协议用）
let Q = '';                // 搜索过滤关键字

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// —— 精细化徽标：验收进度 / 配对断裂 ⚠ / 进行中老化 ——
const ACTIVE_STATUSES = ['draft', 'approved', 'open'];
const ageClass = (c) => {
  if (!ACTIVE_STATUSES.includes(c.status)) return '';
  const d = new Date(c.date);
  if (isNaN(d)) return '';
  const days = Math.floor((Date.now() - d.getTime()) / 864e5);
  return days >= 14 ? 'age2' : days >= 7 ? 'age1' : '';
};
const ageBadge = (c) => {
  const cls = ageClass(c);
  if (!cls) return '';
  const days = Math.floor((Date.now() - new Date(c.date).getTime()) / 864e5);
  return `<span class="age ${cls === 'age2' ? 'a2' : 'a1'}" title="进行中已 ${days} 天">${days}天</span>`;
};
const acceptBadge = (c) =>
  !c.accept ? '' :
  `<span class="acpt ${c.accept.done === c.accept.total ? 'full' : ''}" title="验收标准勾验 ${c.accept.done}/${c.accept.total}">☑${c.accept.done}/${c.accept.total}</span>`;
const alertBadge = (c) =>
  !c.alerts?.length ? '' :
  `<span class="alrt" title="${esc(c.alerts.join('；'))}">⚠${c.alerts.length > 1 ? c.alerts.length : ''}</span>`;

const badge = (c) =>
  (TYPE_LABEL[c.type]
    ? `<span class="type" style="background:${TYPE_COLOR[c.type]}">${TYPE_LABEL[c.type]}</span>`
    : `<span class="type" style="background:var(--dim)">MD</span>`) +
  (c.level ? `<span class="lv ${['L2','L3'].includes(c.level) ? 'hi' : ''}">${esc(c.level)}</span>` : '') +
  acceptBadge(c) + alertBadge(c) + ageBadge(c) +
  `<span class="date">${esc(c.date)}</span>`;

// —— 任务族聚合：同 slug 一卡；head 取入口文档（intent 优先、其次 incident），孤儿用首文档 ——
const TYPE_ORDER = { intents: 0, incidents: 1, plans: 2, specs: 3 };
const TYPE_ABBR = { intents: 'IN', incidents: 'IC', plans: 'PL', specs: 'SP' };
const EXPANDED = new Set();   // 展开中的任务 slug（SSE 刷新后保持）
const familyOf = (cards) => {
  const bySlug = new Map();
  for (const c of cards) {
    if (!bySlug.has(c.slug)) bySlug.set(c.slug, []);
    bySlug.get(c.slug).push(c);
  }
  const fams = [];
  for (const docs of bySlug.values()) {
    const head = docs.find((d) => d.type === 'intents') || docs.find((d) => d.type === 'incidents') || docs[0];
    docs.sort((a, b) => (TYPE_ORDER[a.type] - TYPE_ORDER[b.type]) || a.date.localeCompare(b.date));
    fams.push({
      slug: docs[0].slug, head, docs,
      alerts: docs.flatMap((d) => d.alerts || []),
      author: head.author || docs.map((d) => d.author).find(Boolean) || '',
    });
  }
  return fams.sort((a, b) => b.head.date.localeCompare(a.head.date));
};
const famTypeChips = (fam) =>
  [...new Set(fam.docs.map((d) => d.type))].map((t) =>
    `<span class="type mini" style="background:${TYPE_COLOR[t]}" title="${TYPE_LABEL[t]}">${TYPE_ABBR[t]}</span>`).join('');

async function refreshBoard() {
  let data;
  try {
    const resp = await fetch('/api/board');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    data = await resp.json();
  } catch (e) {
    // 服务不可达：头部提示 + 3s 重试（避免静默保留旧内容而不提示）
    const chip = $('#c-alerts');
    chip.style.display = ''; chip.textContent = '看板服务不可达，重试中'; chip.style.color = 'var(--bad)';
    clearTimeout(retryTimer);
    retryTimer = setTimeout(refreshBoard, 3000);
    return false;
  }
  CARDS = data.cards;
  ROOT = data.root || ROOT;
  CURRENT = CARDS.find((c) => c.file === CURRENT?.file) ?? CURRENT; // 重定位抽屉卡片，避免刷新后徽标/状态陈旧
  for (const t of Object.keys(TYPE_LABEL)) $(`#c-${t}`).textContent = `${TYPE_LABEL[t]} ${data.counts[t] ?? 0}`;
  const groups = Object.fromEntries(COLS.map((c) => [c.key, []]));
  const rest = [];
  const q = Q.trim().toLowerCase();
  // 过滤在族级做：任一成员命中即整卡保留；有过滤词时全部展开便于定位命中文档
  const fams = familyOf(CARDS).filter((f) =>
    !q || f.docs.some((d) => (d.title + ' ' + d.name + ' ' + d.file).toLowerCase().includes(q)));
  for (const fam of fams) {
    const col = COLS.find((c) => c.statuses.includes(fam.head.status));
    (col ? groups[col.key] : rest).push(fam);
  }
  const nAlerts = CARDS.filter((c) => c.alerts?.length).length;
  const ca = $('#c-alerts');
  ca.style.display = nAlerts ? '' : 'none';
  if (nAlerts) { ca.textContent = `⚠ 断档 ${nAlerts}`; ca.style.color = 'var(--bad)'; }
  const cardHtml = (fam, extra = '') => {
    const h = fam.head;
    return `<div class="card ${ageClass(h)}${EXPANDED.has(fam.slug) || q ? ' open' : ''}" data-slug="${esc(fam.slug)}" style="border-left-color:${TYPE_COLOR[h.type]}">` +
      `<div class="row">${famTypeChips(fam)}` +
      (h.level ? `<span class="lv ${['L2','L3'].includes(h.level) ? 'hi' : ''}">${esc(h.level)}</span>` : '') +
      acceptBadge(h) + alertBadge(fam) + ageBadge(h) + extra +
      (fam.author ? `<span class="auth" title="作者（git 最早提交）">${esc(fam.author)}</span>` : '') +
      `<span class="date">${esc(h.date)}</span></div>` +
      `<div class="title">${h.status === 'open' ? '<span class="hold">挂起</span>' : ''}${esc(h.title)}</div>` +
      `<div class="docs">${fam.docs.map((d) =>
        `<div class="doc-item" data-file="${esc(d.file)}" title="打开文档">` +
        `<span class="type" style="background:${TYPE_COLOR[d.type]}">${TYPE_LABEL[d.type]}</span>` +
        `<span class="chip">${esc(d.status)}</span>${alertBadge(d)}` +
        `<span class="doc-title">${esc(d.title)}</span></div>`).join('')}</div></div>`;
  };
  let html = COLS.map((c) => {
    const items = groups[c.key].map((fam) => cardHtml(fam)).join('');
    return `<div class="col"><h2><b>${c.name}</b>${groups[c.key].length}</h2><div class="list">${
      items || '<div class="empty">—</div>'}</div></div>`;
  }).join('');
  if (rest.length) {
    html += `<div class="col"><h2><b>其他</b>${rest.length}</h2><div class="list">${rest.map((fam) =>
      cardHtml(fam, `<span class="chip">${esc(fam.head.status)}</span>`)).join('')}</div></div>`;
  }
  $('#board').innerHTML = html;
  return true;
}

function renderDrawer() {
  if (!CURRENT) return;
  $('#d-badges').innerHTML = badge(CURRENT) +
    (CURRENT.author ? ` <span class="chip" title="git 最早提交">✎ ${esc(CURRENT.author)}</span>` : '') +
    ` <span class="chip">${esc(CURRENT.status)}</span>`;
  $('#d-title').textContent = CURRENT.title;
  const related = CARDS.filter((c) => c.slug === CURRENT.slug && c.file !== CURRENT.file);
  $('#d-related').innerHTML = related.map((c) =>
    `<a data-file="${esc(c.file)}">${TYPE_LABEL[c.type]}${c.status !== CURRENT.status ? ' · ' + esc(c.status) : ''}</a>`).join('');
  document.querySelectorAll('#d-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === TAB));
  if (TAB === 'doc') loadDoc(); else loadHist();
}

async function loadDoc() {
  $('#d-body').innerHTML = '<div class="none">加载中…</div>';
  const { text, error } = await (await fetch(`/api/doc?file=${encodeURIComponent(CURRENT.file)}`)).json();
  if (error) { $('#d-body').innerHTML = `<div class="none">${esc(error)}</div>`; return; }
  // 裸 .md 相对路径引用 → 可点链接（workflow 文档互引多为纯文本路径而非 md 链接语法；
  // 已有 ](path) 链接语法因前缀为 ] 不会被重复包裹）
  const linked = text.replace(
    /(^|[\s（(【>])((?:\.\.\/|\.\/)?(?:intents|incidents|plans|specs)\/[A-Za-z0-9_\-./]+\.md)/g,
    '$1[$2]($2)'
  );
  $('#d-body').innerHTML = `<div class="md">${marked.parse(linked)}</div>`;
}

// —— commit 类型色点（Conventional Commits 首词）——
const CT_COLOR = { feat: 'var(--ok)', fix: 'var(--bad)', docs: 'var(--dim)', test: 'var(--spec)', refactor: 'var(--intent)', chore: 'var(--warn)', style: 'var(--spec)', perf: 'var(--warn)' };
const ctDot = (subject) => {
  const t = (subject.match(/^(\w+)[(:]/) || [])[1];
  return `<span class="ct" style="background:${CT_COLOR[t] || 'var(--dim)'}" title="${t || 'commit'}"></span>`;
};

async function loadHist() {
  $('#d-body').innerHTML = '<div class="none">加载中…</div>';
  const { commits } = await (await fetch(`/api/history?file=${encodeURIComponent(CURRENT.file)}`)).json();
  $('#d-body').innerHTML = commits.length
    ? `<div class="tl">${commits.map((c) =>
        `<div class="tl-item"><div class="tl-sub">${ctDot(c.subject)}${esc(c.subject)}</div>` +
        `<div class="tl-meta">${esc(c.date)} · <code class="hash" data-h="${esc(c.hash)}" title="点击复制完整 hash">${esc(c.hash.slice(0, 9))}</code></div></div>`).join('')}</div>`
    : '<div class="none">暂无提交记录（文件尚未 commit；git 历史只包含已提交的修改）</div>';
}

function openCard(card) { CURRENT = card; TAB = 'doc'; $('#drawer').classList.add('open'); renderDrawer(); }

// —— toast 反馈 ——
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// —— 抽屉内文档内链：md 相对链接 → 抽屉内打开；外链新窗口；仓库代码路径 → vscode 协议 ——
function viewFile(rel) {
  const hit = CARDS.find((c) => c.file === rel);
  if (hit) { openCard(hit); return; }
  // 自由文档（不在看板卡范围，如 workflow/README.md、同名以外的引用）：伪卡视图
  CURRENT = { file: rel, name: rel, slug: rel, title: rel, type: 'link', status: '', level: '', date: '' };
  TAB = 'doc';
  $('#drawer').classList.add('open');
  renderDrawer();
}

function onDocLink(e, a) {
  const href = a.getAttribute('href');
  if (!href || href.startsWith('#')) return; // 页内锚点走默认行为
  if (/^https?:/i.test(href)) { e.preventDefault(); window.open(href, '_blank', 'noopener'); return; }
  e.preventDefault();
  const dir = CURRENT.file.includes('/') ? CURRENT.file.replace(/[^/]*$/, '') : '';
  let rel;
  try { rel = decodeURIComponent(new URL(href, 'http://x/' + dir).pathname.slice(1)); } catch { return; }
  if (/\.md$/i.test(rel)) { viewFile(rel); return; }
  if (ROOT && !/^[a-z]+:/i.test(rel)) { window.open(`vscode://file/${ROOT}/${rel}`); toast('已用编辑器打开 ' + rel); }
}

document.addEventListener('click', (e) => {
  const dLink = e.target.closest('#d-body a');
  if (dLink) { onDocLink(e, dLink); return; }
  // 展开区文档条目 → 开抽屉（先于卡片命中，条目在卡内）
  const item = e.target.closest('.doc-item');
  if (item) {
    const hit = CARDS.find((c) => c.file === item.dataset.file);
    if (hit) openCard(hit);
    return;
  }
  // 卡片点击 → 就地展开/收起该任务
  const card = e.target.closest('.card');
  if (card) {
    const slug = card.dataset.slug;
    if (EXPANDED.has(slug)) EXPANDED.delete(slug); else EXPANDED.add(slug);
    card.classList.toggle('open');
    return;
  }
  const rel = e.target.closest('#d-related a');
  if (rel) {
    const hit = CARDS.find((c) => c.file === rel.dataset.file);
    if (hit) { CURRENT = hit; renderDrawer(); }
    return;
  }
  const hash = e.target.closest('.hash');
  if (hash) navigator.clipboard.writeText(hash.dataset.h)
    .then(() => toast('已复制 ' + hash.dataset.h.slice(0, 9)))
    .catch(() => toast('复制失败'));
});
$('#d-close').onclick = () => { $('#drawer').classList.remove('open'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });
document.querySelectorAll('#d-tabs button').forEach((b) => b.onclick = () => { TAB = b.dataset.tab; renderDrawer(); });

// SSE：服务端 fs.watch 防抖后推送 changed → 看板与打开中的抽屉自动刷新
const sse = new EventSource('/api/events');
sse.addEventListener('changed', () => { refreshBoard().then((ok) => { if (ok) renderDrawer(); }); });
sse.addEventListener('watchdead', () => { $('#sse').classList.remove('on'); $('#sse').classList.add('poll'); $('#sse span:last-child').textContent = '监听失效 · 60s 轮询'; });
sse.onopen = () => { $('#sse').classList.add('on'); $('#sse').classList.remove('poll'); $('#sse span:last-child').textContent = '实时'; };
sse.onerror = () => { $('#sse').classList.remove('on'); $('#sse span:last-child').textContent = '连接断开，自动重连中'; };

// 60s 兜底轮询：SSE/watch 任何环节失效时数据仍保鲜（正常时多拉一次无害）
setInterval(() => refreshBoard(), 60000);

// 搜索过滤：本地过滤标题/slug/文件，SSE 刷新时保持关键字
$('#q').addEventListener('input', (e) => { Q = e.target.value; refreshBoard(); });

refreshBoard();
</script>
</body>
</html>
