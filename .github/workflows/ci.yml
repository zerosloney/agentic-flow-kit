# CI — push(main) 与全部 PR 跑全套测试；ubuntu + windows × node 18/20/22 六组合。
# windows 统一走 bash（runner 自带 Git Bash）：让 check-loop bash 套件真实执行，而不是被 run-tests 的无 sh 分支跳过。
# **node 20.x 为何在矩阵里（2026-09-28 跨版本登记）**：20.19 是 `require(esm)` 默认可用的分界版本
# （18 从不支持；20.19+ 与 22.12+ 才可用）。本仓曾因此踩过真缺陷——装户取数模块首版约定 `.mjs` 并用
# require() 载入，实测在 18.20.5 / 20.18.0 / 22.11.0 全 ERR_REQUIRE_ESM，而本机 v24 恰好支持、
# 全绿掩盖了它。现已改用 `.cjs` 去掉该版本线依赖；保留 20.x 是为了让**这类版本分界差异**今后更早暴露。
# 机器门（服务端兜底，2026-09-27 gate-coverage）：本地钩子是唯一本地机器门、可被 --no-verify 或未配 hooksPath
# 的克隆绕过——CI 在 runner 上复跑四道真实仓库门（check-loop / doctor / source-sync-check --gate /
# workflows-check），任一非零即红。四脚本均秒级只读，不拖慢矩阵。
# **shipped 套件步骤（2026-09-28 补）**：`npm test` 只跑 `templates/` 副本（见 src/run-tests.mjs），
# 而装户实际拿到的是 `.agents/` 下的 shipped 副本——**同一份字节、不同路径上下文**，故前者绿不代表后者可用
# （上一轮 P1：shipped 套件在装户 `ERR_MODULE_NOT_FOUND` 整个崩，CI 因只跑 templates/ 而看不见；
# 实测同字节两处跑出的断言数都不同：118 vs 116）。该步骤显式跑 `.agents/scripts/*.test.mjs`，钉住这个盲区。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 机器门（服务端兜底——本地钩子可被绕过，此处复跑真实仓库门）
        run: |
          git config core.hooksPath .githooks # 克隆无本地钩子配置（AGENTS.md 要求的本地手工步骤），runner 侧补上
          node .agents/scripts/check-loop.mjs
          node bin/flow-kit.mjs doctor
          node .agents/scripts/source-sync-check.mjs --gate
          node .agents/scripts/workflows-check.mjs
      - run: npm test
      - name: shipped 套件（.agents/ 装副本——npm test 只跑 templates/，此处补装户视角）
        run: |
          # 逐套件跑 .agents/scripts/*.test.mjs；任一非零即红。
          # 与 npm test 的 templates/ 侧成对：两侧都绿才算「本仓能跑 **且** 装户能跑」。
          fail=0
          for f in .agents/scripts/*.test.mjs; do
            echo "===== $f ====="
            node "$f" || fail=1
          done
          exit $fail
