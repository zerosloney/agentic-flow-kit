# 引擎仓自身 CI（纯包源形态——装户端内容清理后，远端门只跑引擎自检）
# npm test = lint（eslint 未装显式 skip）+ 全量套件（src/ + templates/_agents/scripts/）。
# 纯包源后本仓无本地钩子——CI 是唯一机器门：双平台矩阵守 win32 分支（git.exe/路径/spawn 差异，
# check-loop.mjs 记录过 ubuntu vs win32 行为分叉事故）。
# 装户侧远端门是另一份：templates/_github/workflows/kit-ci.yml（随包下发，在装户仓跑 verify.mjs）。
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # 重复率漂移检查（jscpd-drift-gate）：**手动触发，不进 push/PR 路径**——
  #   jscpd 需 `npx --yes` 联网取包 + 建 worktree + 全仓扫描（约 1-2 分钟），放常驻路径
  #   等于给门禁引入网络依赖（断网即失败 = 绕过口）。它是 advisory 报告器，不是门。
  #   与 check-loop 的 20 项检查不同源：本仓尚无 jscpd 依赖（零运行时依赖是硬约束）。
  workflow_dispatch:
    inputs:
      warn_pct:
        description: '抬升告警阈值（百分点）'
        default: '1.0'
      fail_pct:
        description: '显著抬升阈值（百分点）'
        default: '3.0'
      ref:
        description: '实测面（git ref，默认 HEAD；填基线 commit 即 --verify-baseline 口径自查）'
        default: 'HEAD'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18, 22]  # engines >=18：守地板与当前 LTS
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖（镜像故障走官方源兜底，不阻塞 CI）
        run: npm ci || npm install || npm install --registry=https://registry.npmjs.org
      - name: 引擎自检（lint + 全量套件）
        run: npm test

  # 引擎本体完整性门（check-engine-integrity）——本仓唯一能防「改弱门禁本体」的检查。
  # 此前它是**死代码**：脚本在库、但基线 templates/_agents/engine-lock.json 从未入库，
  # 且 ci.yml / .githooks / npm test 三处都没有调用点（git grep 只命中 render.mjs 注释与它自己的单测）
  # → 本地基线层、跨提交锚层双层跳过，只剩「硬拦单位数不收缩」计数，等于从未作为门跑过。
  # 本 job 把两层判据接成机器门：
  #   ① 盘面 ↔ 入库基线：逐项 sha256 + 硬拦单位数。改内容而未跑 --update 显式入账 → 拦
  #     （本门无声明式豁免，修法只留 --update + CHANGELOG 同批，见脚本头）；硬拦单位数下降
  #     （删 blocker / exit 1 / 判据行）→ 无条件拦。
  #   ② 跨提交锚（--against-ref HEAD~1）：参照物读自 git 对象库，兜「恶意分支同时改弱门禁
  #     并 --update 重写基线」这一自洽形态（本地层对这种操作是自洽的，CI 会全绿）。
  # fetch-depth: 2 —— 默认浅克隆下 HEAD~1 不可解析，锚层会被静默跳过（不误报，但也白跑）。
  # 诚实边界：HEAD~1 在多提交 PR 上不等于 merge-base（严格应比 base.sha，这里取更保守的近邻提交）；
  #   --no-verify / 删掉本脚本 / 不启用本 job 仍可绕过——本地信任边界内不可机器防，沿文件头口径。
  # 独立于 test job（不占 4 宫格）：本门只读 fs 与 git 对象库，无矩阵差异、无依赖安装需求。
  engine-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 引擎完整性门（入库基线 + 跨提交锚）
        run: node templates/_agents/scripts/check-engine-integrity.mjs --against-ref HEAD~1
      # 跨宿主薄适配漂移门（B4）：改权威源要同步 N 份薄适配，人工 grep 易漏。
      #   source-sync-check 删除后本仓一度无任何调用点，靠人工跑一次 --diff 兜——本步把它变成机器门。
      #   默认 --diff 仍恒 exit 0（人工跑不因漂移而失败），--strict 才把漂移判红。
      - name: 跨宿主薄适配漂移门（strict）
        run: node bin/flow-kit.mjs sync-hosts --diff --strict

  # 手动触发才跑；恒 exit 0（advisory 报告器）——阈值触达不红，报告贴进 run summary 供人判。
  jscpd-drift:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 基线 commit 与实测 ref 都需完整历史（worktree add 依赖）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 基线可解析性快检（不出网，先挡「基线坏了却在跑 2 分钟 jscpd」）
        run: node scripts/jscpd-drift.mjs --no-run
      - name: 重复率漂移检查（基线 commit vs ${{ inputs.ref }}）
        run: |
          node scripts/jscpd-drift.mjs --warn-pct '${{ inputs.warn_pct }}' --fail-pct '${{ inputs.fail_pct }}' \
            ${{ inputs.ref != 'HEAD' && '--verify-baseline' || '' }} --json | tee drift.json
      - name: 报告入 run summary（恒不失败——这是报告器不是门）
        if: always()
        run: |
          echo '### jscpd 重复率漂移（advisory）' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat drift.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(无输出)'
          echo '```' >> "$GITHUB_STEP_SUMMARY"
